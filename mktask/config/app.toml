label = "Title"
type = "text"
required = true
placeholder = "What needs doing?"

[[panes.tasks.buttons.action.dialog.fields]]

[[panes.tasks.buttons.action.dialog.fields.row]]
name = "importance"
label = "Importance"
type = "select"
width = 0.5
value = 3
options = [
  { value = 1, label = "1 - Lowest" },
  { value = 2, label = "2 - Low" },
  { value = 3, label = "3 - Medium" },
  { value = 4, label = "4 - High" },
  { value = 5, label = "5 - Highest" },
]

[[panes.tasks.buttons.action.dialog.fields.row]]
name = "urgency"
label = "Urgency"
type = "select"
width = 0.5
value = 3
options = [
  { value = 1, label = "1 - Lowest" },
  { value = 2, label = "2 - Low" },
  { value = 3, label = "3 - Medium" },
  { value = 4, label = "4 - High" },
  { value = 5, label = "5 - Highest" },
]

[[panes.tasks.buttons.action.dialog.fields]]
name = "due"
label = "Due (YYYY-MM-DD, optional)"
type = "text"
placeholder = "2026-12-31"
value = ""

# The Assigned To picker is three fields. `_assignee` is the picker, whose
# blank row (mkui's own) is unassigned and whose `__new__` row reveals
# `_new_assignee`; both are scratch, and the hidden `assigned_to` is what is
# sent. Edit and Split repeat this with the task's own name preselected.
[[panes.tasks.buttons.action.dialog.fields]]
name = "_assignee"
label = "Assigned To"
type = "select"
optionsFrom = { service = "assignee_options", value = "value", label = "label" }

[[panes.tasks.buttons.action.dialog.fields]]
name = "_new_assignee"
label = "New name"
type = "text"
required = "_assignee == '__new__'"
showWhen = "_assignee == '__new__'"
placeholder = "A name typed here joins the list"

[[panes.tasks.buttons.action.dialog.fields]]
name = "assigned_to"
type = "hidden"
compute = "IF(_assignee == '__new__', TRIM(_new_assignee ?? ''), _assignee)"

[[panes.tasks.buttons.action.dialog.fields]]
name = "notes"
label = "Notes"
type = "textarea"
value = ""

[[panes.tasks.buttons]]
label = "Edit"
unit = "row"
enable = { connected = true }
action.type = "dialog"

[panes.tasks.buttons.action.dialog]
title = "Edit Task ID ${row.task_id}"
modal = true
width = 440
submit = { label = "Save", service = "tasks", op = "edit" }

[[panes.tasks.buttons.action.dialog.fields]]
name = "task_id"
type = "hidden"
value = "${row.task_id}"

[[panes.tasks.buttons.action.dialog.fields]]
name = "updated_at"
type = "hidden"
value = "${TIME(NOW(), '%Y-%m-%d %H:%M:%S')}"

[[panes.tasks.buttons.action.dialog.fields]]
name = "title"
label = "Title"
type = "text"
required = true
placeholder = "What needs doing?"
value = "${row.title}"

[[panes.tasks.buttons.action.dialog.fields]]

[[panes.tasks.buttons.action.dialog.fields.row]]
name = "importance"
label = "Importance"
type = "select"
width = 0.5
value = "${row.importance}"
options = [
  { value = 1, label = "1 - Lowest" },
  { value = 2, label = "2 - Low" },
  { value = 3, label = "3 - Medium" },
  { value = 4, label = "4 - High" },
