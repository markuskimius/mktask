type = "select"
width = 0.5
value = "${row.urgency}"
options = [
  { value = 1, label = "1 - Lowest" },
  { value = 2, label = "2 - Low" },
  { value = 3, label = "3 - Medium" },
  { value = 4, label = "4 - High" },
  { value = 5, label = "5 - Highest" },
]

[[panes.tasks.buttons.action.dialog.fields]]
name = "due"
label = "Due (YYYY-MM-DD, optional)"
type = "text"
placeholder = "2026-12-31"
value = "${row.due}"

[[panes.tasks.buttons.action.dialog.fields]]
name = "_assignee"
label = "Assigned To"
type = "select"
compute = "row.assigned_to ?? ''"

[panes.tasks.buttons.action.dialog.fields.optionsFrom]
service = "task_assignee_options"
params = { task_id = "${row.task_id}" }
value = "value"
label = "label"

[[panes.tasks.buttons.action.dialog.fields]]
name = "_new_assignee"
label = "New name"
type = "text"
required = "_assignee == '__new__'"
showWhen = "_assignee == '__new__'"
placeholder = "A name typed here joins the list"

[[panes.tasks.buttons.action.dialog.fields]]
name = "assigned_to"
type = "hidden"
compute = "IF(_assignee == '__new__', TRIM(_new_assignee ?? ''), _assignee)"

[[panes.tasks.buttons.action.dialog.fields]]
name = "notes"
label = "Notes"
type = "textarea"
value = "${row.notes}"

# Wide because mkui clips a dialog's status line to one row, and the server's
# refusals have to fit. The top level is the `__top__` option, not "": mkui
# prepends a blank of its own, which `required` refuses.
[[panes.tasks.buttons]]
