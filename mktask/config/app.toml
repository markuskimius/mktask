# mktask's whole UI: menubar, statusbar, dialogs, panes, frames, layouts.
#
# mkio serves this file as /config/app.json (the [config] route in
# mktask.toml), parsed on every request; index.html fetches that and hands it
# to mkui's setConfig. Name a column in mktask.toml before using it here:
# tests/test_ui_config.py holds every service, op, field and column named
# below to the server config.
#
# Two things TOML asks of whoever edits this:
#   - It has no null. "" stands in for one, and mkui reads it the same way.
#   - A [table] under an [[array]] header belongs to the array element above
#     it, so a block moved elsewhere in the file silently changes owner.

# ─── app ───────────────────────────────────────────────────────────────

# No `version` here: it would go stale on the next release. The About heading
# and the statusbar both show the version the server announced.
[app]
title = "mktask"
theme = "dark"
description = "Work task prioritizer built on mkio and mkui"
copyright = "© 2026 Mark Kim · Apache-2.0"
links = [
  { label = "GitHub", href = "https://github.com/markuskimius/mktask" },
  { label = "Report an issue", href = "https://github.com/markuskimius/mktask/issues" },
  { label = "License", href = "https://github.com/markuskimius/mktask/blob/main/LICENSE" },
]

[app.about]
builtins = ["server", "mkui", "mkio"]
heading = "mktask${IF(state.mkio.server.version, CONCAT(' ', state.mkio.server.version), '')}"

# ─── state ─────────────────────────────────────────────────────────────

# Declared so the panes that publish a selection have somewhere to put it.
# "" is nothing selected.
[state]
status = { message = "Connecting...", background = "#858585", color = "#000" }
selected_task = ""
selected_ref = ""

# ─── menubar ───────────────────────────────────────────────────────────

[[menubar]]
label = "Tasks"
items = [
  { label = "Tasks", action = "pane.show", args = "tasks" },
  { label = "Detail", action = "pane.show", args = "task-detail" },
  { label = "References", action = "pane.show", args = "references" },
  { label = "Activity", action = "pane.show", args = "activity" },
]

[[menubar]]
label = "Edit"
items = [
  { label = "Undo", action = "edit.undo" },
  { label = "Redo", action = "edit.redo" },
  { sep = true },
  { label = "Copy", action = "edit.copy", shortcut = "mod+C" },
  { label = "Select All", action = "edit.selectAll", shortcut = "mod+A" },
]

# The two lists that are settings rather than work.
[[menubar]]
label = "Configure"
items = [
  { label = "Relations", action = "pane.show", args = "relations" },
  { label = "Assignees", action = "pane.show", args = "assignees" },
]

[[menubar]]
label = "Layout"
items = [
  { label = "Save Layout", action = "layout.save" },
  { label = "Restore Layout", layouts = true },
  { sep = true },
  { label = "Reset to Default", action = "layout.reset" },
]

[[menubar]]
label = "Window"

[[menubar.items]]
label = "Cascade"
action = "window.cascade"

[[menubar.items]]
label = "Tile"
items = [
  { label = "Horizontal", action = "window.tileH" },
  { label = "Vertical", action = "window.tileV" },
  { label = "Grid", action = "window.grid" },
]

[[menubar.items]]
sep = true

[[menubar.items]]
windows = true

[[menubar]]
label = "Help"
items = [
  { label = "Keyboard Shortcuts", action = "dialog.open", args = "shortcuts" },
  { sep = true },
  { label = "About", action = "dialog.about" },
]

# ─── dialogs ───────────────────────────────────────────────────────────

# Help › Keyboard Shortcuts. Every menu `shortcut` hint above needs a line here.
[dialogs.shortcuts]
title = "Keyboard Shortcuts"
kind = "info"
width = 520
heading = "Tables and dialogs"
facts = [
  { label = "Ctrl/Cmd+C", value = "Copy the selected rows" },
  { label = "Ctrl/Cmd+A", value = "Select every row" },
  { label = "Ctrl/Cmd+F", value = "Find in the focused table" },
  { label = "Ctrl/Cmd+G", value = "Next match (with Shift: the previous one)" },
  { label = "Escape", value = "Clear the selection, or close a dialog that is not pinned" },
  { label = "Enter", value = "Submit a dialog from a single-line field" },
  { label = "Ctrl/Cmd+Enter", value = "Submit a dialog from anywhere in it" },
  { label = "Shift+click a header", value = "Sort by several columns" },
  { label = "Shift+click a caret", value = "Unfold every level under it, or fold them all; on the header caret, the whole blotter" },
  { label = "Alt+Shift+Left / Right", value = "Move the active tab within its group" },
  { label = "Undo, Redo", value = "No key, on purpose: they change what everyone sees" },
]
buttons = [{ label = "Close", cancel = true, default = true }]

# ─── statusbar ─────────────────────────────────────────────────────────

[statusbar]
left = [{ type = "text", bind = "status.message" }]
right = [
  { type = "text", text = "mktask${IF(state.mkio.server.version, CONCAT(' ', state.mkio.server.version), '')}" },
]
bindStyle = { color = "status.color", background = "status.background" }

# ─── layouts ───────────────────────────────────────────────────────────

[layouts]
key = "mktask"
keep = 10
keepDays = 7

# ─── panes.tasks ───────────────────────────────────────────────────────

# Every table pane lists each column its query returns in `columns`, which is
# what the Columns picker offers, and the ones it opens on in `visible`, which
# is what Reset to default returns to. A column missing from `columns` could
# not be shown at all.

# The blotter. A tree on parent_task_id, opened folded on the roots.
# `filterScope = "all"` tests every row against the status filter while
# keeping the way to a match: a complete child under an open parent is hidden,
# an open child keeps its complete parent in view.
[panes.tasks]
title = "Tasks"
type = "mkio-table"
service = "all_tasks"
protocol = "query"
columns = [
  "task_id", "parent_task_id", "title", "score", "importance", "urgency", "due", "assigned_to", "status",
  "last_event", "notes", "created_at", "updated_at", "completed_at", "_mkio_version",
]
visible = [
  "task_id", "title", "score", "importance", "urgency", "due", "assigned_to", "status",
  "last_event", "notes", "created_at", "_mkio_version",
]
# Virtual column: the placeholder for the real prioritization model.
values = { score = "importance * urgency" }
types = { due = "time", created_at = { type = "time", parse = "%Y-%m-%d %H:%M:%S" }, updated_at = { type = "time", parse = "%Y-%m-%d %H:%M:%S" }, completed_at = { type = "time", parse = "%Y-%m-%d %H:%M:%S" } }
tree = { child = "parent_task_id", parent = "task_id", column = "task_id", expand = 0, filterScope = "all" }
sort = ["-score", "created_at"]
filters = { status = ["open"] }
rowStyle = [{ when = "status == 'complete'", color = "#858585", strike = true }]
select = { state = "selected_task" }
link = { broadcast = { task_id = "task_id" }, chips = false }

[panes.tasks.labels]
task_id = "Task ID"
parent_task_id = "Parent"
title = "Title"
score = "Score"
importance = "Imp"
urgency = "Urg"
due = "Due"
status = "Status"
created_at = "Created"
updated_at = "Updated"
completed_at = "Completed"
last_event = "Last Event"
assigned_to = "Assigned To"
notes = "Notes"

[panes.tasks.styles]
score = [
  { when = "value >= 16", color = "#f44747", bold = true },
  { when = "value >= 9", color = "#dcdcaa" },
  { color = "#858585" },
]
status = [{ when = "value == 'complete'", color = "#4ec9b0" }]

# No Reference button: adding one is the References pane's job. No dialog
# sends task_id on add or split -- the server assigns it.
[[panes.tasks.buttons]]
label = "New"
enable = { connected = true }
action.type = "dialog"

[panes.tasks.buttons.action.dialog]
title = "New Task"
modal = true
width = 440
