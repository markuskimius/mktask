<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>mktask</title>
  <link rel="stylesheet" href="/mkui/styles/mkui.css">
  <link rel="stylesheet" href="/static/mktask.css">
  <script type="module">
    import "/mkui/src/index.js";
    import "/static/refs.js";   // registers the task-refs widget

    // Revalidate rather than trust heuristic freshness: before mkio 1.6.0
    // static files carried no Cache-Control, and a stale app.json silently
    // pinned the UI to an old layout. Kept: it costs a 304 and guards
    // against a proxy of its own mind.
    const res = await fetch("/static/app.json", { cache: "no-cache" });
    const config = await res.json();
    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    config.mkio.url = `${wsProto}//${location.host}/ws`;
    document.querySelector("mkui-app").setConfig(config);
  </script>
</head>
<body>
  <mkui-app></mkui-app>
</body>
</html>
