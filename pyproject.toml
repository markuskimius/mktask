[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mktask"
dynamic = ["version"]
description = "Work task prioritizer built on mkio and mkui"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Mark Kim" }]
keywords = ["tasks", "todo", "prioritization", "mkui", "mkio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "mkio>=0.2.0",
    "mkui>=0.2.9",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-asyncio",
    "pytest-aiohttp",
]

[project.urls]
Homepage = "https://github.com/markuskimius/mktask"
Repository = "https://github.com/markuskimius/mktask"
Issues = "https://github.com/markuskimius/mktask/issues"

[project.scripts]
mktask = "mktask.__main__:main"

[tool.hatch.version]
path = "mktask/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
